services:
  lumapa-landing:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_LUMAPA_WALLET_URL: "https://app.lumapa.ir"
        NEXT_PUBLIC_GITHUB_REPO_URL: "https://github.com/YOUR_ORG/YOUR_REPO"
        NEXT_PUBLIC_LUMAPA_HORIZON_URL: "https://horizon.badje.ir"
        NEXT_PUBLIC_LUMAPA_NETWORK_PASSPHRASE: "Lumapa Network ; July 2026"
        NEXT_PUBLIC_LUMAPA_NATIVE_SYMBOL: "BADJ"
        NEXT_PUBLIC_LUMAPA_NATIVE_NAME: "Lumapa native"
    image: lumapa-landing:latest
    container_name: lumapa-landing
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      LUMAPA_DATA_DIR: /data
      LUMAPA_PUBLIC_BASE_URL: "https://lumapa.ir"
      NEXT_PUBLIC_LUMAPA_WALLET_URL: "https://app.lumapa.ir"
      NEXT_PUBLIC_GITHUB_REPO_URL: "https://github.com/YOUR_ORG/YOUR_REPO"
      NEXT_PUBLIC_LUMAPA_HORIZON_URL: "https://horizon.badje.ir"
      NEXT_PUBLIC_LUMAPA_NETWORK_PASSPHRASE: "Lumapa Network ; July 2026"
      NEXT_PUBLIC_LUMAPA_NATIVE_SYMBOL: "BADJ"
      NEXT_PUBLIC_LUMAPA_NATIVE_NAME: "Lumapa native"
      LUMAPA_NETWORK_PASSPHRASE: "Lumapa Network ; July 2026"
    volumes:
      - lumapa_landing_data:/data

volumes:
  lumapa_landing_data:
