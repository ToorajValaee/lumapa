# Lumapa production Nginx example.
# Both domains go to the same Next.js container.
# The app uses the Host header to decide whether to show the landing page or the wallet.

upstream lumapa_nextjs {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name lumapa.ir www.lumapa.ir app.lumapa.ir;

    # Use certbot or your SSL provider to convert this to HTTPS.
    # Example after certbot: listen 443 ssl http2; plus ssl_certificate lines.

    location / {
        proxy_pass http://lumapa_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
